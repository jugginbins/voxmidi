name: Build VoxMidi

# Free for public repositories; private repositories get a monthly free-minutes allowance.
# Push this project to GitHub, open the "Actions" tab, and download the finished plugins
# from the "Artifacts" section of the run.

# To publish a downloadable release for everyone:
#   git tag v0.1.0 && git push --tags
# The "release" job below then attaches VoxMidi-Windows.zip, VoxMidi-macOS.zip and VoxMidi-Linux.zip.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: VoxMidi-Windows
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            artifact: VoxMidi-macOS
          - name: Linux
            os: ubuntu-latest
            artifact: VoxMidi-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc sign macOS bundles
        if: runner.os == 'macOS'
        run: |
          find build -name "*.vst3" -o -name "*.component" -o -name "*.app" | while read b; do
            codesign --force --deep -s - "$b" || true
          done

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          find build -type d \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -prune \
            -exec cp -R {} dist/ \;
          # standalone apps on Windows / Linux are plain executables
          find build -path "*_artefacts/Release/Standalone/*" -type f \( -name "*.exe" -o -perm -u+x \) ! -name "*.so" \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -qry "../$name.zip" .)
          done
          ls -la *.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
